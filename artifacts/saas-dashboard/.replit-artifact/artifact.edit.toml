kind = "react-vite"
previewPath = "/"
title = "SaaS Dashboard"
version = "1.0.0"
id = "saas-dashboard-001"

[[services]]
localPort = 5173
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/saas-dashboard run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/saas-dashboard", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
