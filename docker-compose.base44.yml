# =============================================================================
# docker-compose.base44.yml — Base44 dev environment
#
# Dev-oriented compose: runs the NestJS API and Vite dashboard FROM SOURCE
# with live reload, backed by PostgreSQL (pgvector) and Redis.
# Uses node:20 (glibc) — the pnpm overrides exclude musl platform packages.
# =============================================================================
services:

  # ── PostgreSQL (pgvector) ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_base44_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/dashboard-tables.sql:/docker-entrypoint-initdb.d/02-dashboard-tables.sql:ro
      - ./docker/postgres/dashboard-seed.sql:/docker-entrypoint-initdb.d/03-dashboard-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --requirepass redis_base44_dev
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_base44_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Setup (one-shot) ────────────────────────────────────────────────────────
  # Installs pnpm deps, generates Prisma client, pushes DB schemas, seeds data.
  # Drizzle push runs BEFORE Prisma push so the DB is empty (no schema conflicts).
  setup:
    image: node:20
    working_dir: /workspace
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./:/workspace
    command: >
      sh -c '
      corepack enable && corepack prepare pnpm@10 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server run prisma:generate &&
      pnpm --filter @workspace/api-server exec prisma db push --schema=./prisma/schema.prisma --accept-data-loss &&
      PGPASSWORD=postgres_base44_dev psql -h postgres -U postgres -d whatsapp_saas -f /workspace/docker/postgres/dashboard-tables.sql &&
      pnpm --filter @workspace/api-server run prisma:seed &&
      pnpm --filter @workspace/api-server exec tsx prisma/seed-demo-user.ts
      '
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── NestJS API (dev with live reload) ───────────────────────────────────────
  api:
    image: node:20
    working_dir: /workspace
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3001
    volumes:
      - ./:/workspace
    command: >
      sh -c '
      corepack enable && corepack prepare pnpm@10 --activate &&
      cd artifacts/api-server &&
      SWC_REGISTER=$$(node -e "console.log(require.resolve(\"@swc-node/register\"))") &&
      node --watch --watch-path src -r "$$SWC_REGISTER" src/main.ts
      '
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Evolution API (WhatsApp gateway) ─────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2.2.1
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: evolution_base44_dev_key
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      SERVER_PORT: "8080"
      SERVER_TYPE: http
      LANGUAGE: en
      LOG_LEVEL: info
      LOG_BAILEYS: error
      # Database — separate postgres instance
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://evolution:evolution_base44_dev@evolution-db:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Cache — share existing Redis with prefix
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:redis_base44_dev@redis:6379
      CACHE_REDIS_PREFIX_KEY: "evolution:"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_REDIS_TTL: "3600"
      # Disable optional integrations
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      PUSHER_ENABLED: "false"
      OPENAI_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      DIFY_ENABLED: "false"
      S3_ENABLED: "false"
      SQS_ENABLED: "false"
      # Config
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      # Webhook (global)
      WEBHOOK_GLOBAL_ENABLED: "false"
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Evolution API PostgreSQL ────────────────────────────────────────────────
  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_base44_dev
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Vite dashboard (dev with HMR) ────────────────────────────────────────────
  web:
    image: node:20
    working_dir: /workspace
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BASE_PATH=/
      - API_PROXY_TARGET=http://api:3001
    volumes:
      - ./:/workspace
    command: >
      sh -c '
      corepack enable && corepack prepare pnpm@10 --activate &&
      pnpm --filter @workspace/saas-dashboard run dev
      '
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  evolution_db_data:
