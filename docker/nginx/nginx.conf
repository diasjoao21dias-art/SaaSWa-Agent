# =============================================================================
# nginx.conf — Reverse proxy + static file server
#
# Roteamento:
#   /api/*        → NestJS API (container "api", porta 3000)
#   /evolution/*  → Evolution API (container "evolution", porta 8080)
#   /*            → Frontend React (arquivos estáticos em /usr/share/nginx/html)
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # Limites de upload (para envio de arquivos de knowledge base)
    client_max_body_size 50m;

    # ── Upstream: NestJS API ──────────────────────────────────────────────────
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    # ── Upstream: Evolution API ───────────────────────────────────────────────
    upstream evolution_backend {
        server evolution:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ── API Backend (/api/*) ──────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts maiores para operações longas (ex: upload de documentos)
            proxy_connect_timeout 30s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ── Evolution API (/evolution/*) ─────────────────────────────────────
        # Webhooks do WhatsApp chegam aqui e são repassados ao Evolution API
        location /evolution/ {
            proxy_pass         http://evolution_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # WebSocket (necessário para o Evolution API)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ── Frontend React (/* — tudo o resto) ───────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;

            # SPA: redireciona qualquer rota desconhecida para index.html
            try_files $uri $uri/ /index.html;

            # Cache de assets com hash (ex: main.abc123.js)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── Health check do nginx ─────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
